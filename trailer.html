// ---------- drawing helpers ----------
const glow=(x,y,r,c,a)=>{const q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,rgba(c,a));q.addColorStop(1,rgba(c,0));g.fillStyle=q;g.fillRect(x-r,y-r,r*2,r*2)};
const ring=(x,y,rx,ry,c,lw,a,rot,dash)=>{g.save();g.translate(x,y);g.rotate(rot||0);g.strokeStyle=rgba(c,a);g.lineWidth=lw;g.setLineDash(dash||[]);g.lineDashOffset=-T*30;g.beginPath();g.ellipse(0,0,rx,ry,0,0,TAU);g.stroke();g.restore()};
const poly=(x,y,r,n,rot)=>{g.beginPath();for(let i=0;i<n;i++){const a=rot+i*TAU/n;g[i?'lineTo':'moveTo'](x+cos(a)*r,y+sin(a)*r)}g.closePath()};
const stars=(n,sd,par,a)=>{for(let i=0;i<n;i++){const x=((rnd(i+sd)*W*1.4-par)%W+W)%W,y=rnd(i*3+sd)*H*.75;g.fillStyle=rgba('#ffffff',a*(.4+.6*sin(T*2+i))*.8);g.fillRect(x,y,2,2)}};
const sky=(a,b)=>{const q=g.createLinearGradient(0,0,0,H);q.addColorStop(0,a);q.addColorStop(1,b);g.fillStyle=q;g.fillRect(0,0,W,H)};
const ground=(y,c)=>{g.fillStyle=c;g.fillRect(0,y,W,H-y)};
const cols=(n,sd,y,h0,h1,w,col,par,gc)=>{const L=W*1.1;for(let i=0;i<n;i++){const x=((i*L/n+rnd(i+sd)*90-par)%L+L)%L-60,h=h0+rnd(i*5+sd)*(h1-h0);g.fillStyle=col;g.fillRect(x,y-h,w,h);if(gc){g.fillStyle=rgba(gc,.5);g.fillRect(x+w/2-2,y-h+12,4,h*.6)}}};
function shp(x,y,s,i){g.beginPath();const k=i%4;if(k===0)g.arc(x,y,s,0,TAU);else if(k===1){g.moveTo(x-s,y-s);g.lineTo(x+s,y-s);g.quadraticCurveTo(x+s,y+s*.5,x,y+s*1.2);g.quadraticCurveTo(x-s,y+s*.5,x-s,y-s)}else if(k===2){g.moveTo(x-s*.8,y+s);g.lineTo(x-s*.8,y-s*.2);g.arc(x,y-s*.2,s*.8,Math.PI,0);g.lineTo(x+s*.8,y+s)}else poly(x,y,s,6,.52);g.stroke()}
// protagonist: idle = anchored bob/sway/breathe; mv = intentional walk
function pfp(x,y,h,mv,s0=1){const w=h*sw/sh,b=mv?Math.abs(sin(T*9))*10:sin(T*2)*4,sx=mv?0:sin(T*1.3)*2,br=mv?1:1+.014*sin(T*2);
 g.fillStyle='rgba(0,0,0,.45)';g.beginPath();g.ellipse(x,y+4,w*.45*s0,h*.05*s0,0,0,TAU);g.fill();
 g.save();g.translate(x+sx,y-b);g.scale(s0*br,s0*br);g.shadowColor=P[0];g.shadowBlur=30;g.imageSmoothingEnabled=false;g.drawImage(spr,-w/2,-h,w,h);g.restore()}

function hub(lit){const cx=800,cy=330;sky('#02030a','#0b0a1f');glow(300,250,600,P[2],.18);glow(1300,420,650,P[1],.14);stars(90,1,T*6,1);

 glow(cx,cy,260+300*lit,P[0],.2+.5*lit);
 for(let k=0;k<3;k++)ring(cx,cy,130+k*60,130+k*60,P[k],3,.25+.6*lit,T*(k%2?-.3:.25)*(.3+lit),[22,14]);
 g.save();g.shadowColor=P[0];g.shadowBlur=20+50*lit;g.fillStyle='#fff';g.globalAlpha=.3+.7*lit;g.beginPath();g.arc(cx,cy,46*(1+.05*sin(T*2)),0,TAU);g.fill();g.restore();
 const ps=[];for(let i=0;i<12;i++){const a=i/12*TAU+.26;ps.push([cx+cos(a)*640,440+sin(a)*250,lit*13>i])}
 ps.forEach(([x,y,on],i)=>{g.strokeStyle=rgba(P[i%3],on?.55:.08);g.lineWidth=2;g.setLineDash([]);g.beginPath();g.moveTo(x,y);g.lineTo(cx,cy);g.stroke();if(on){const f=(T*.3+i*.13)%1;g.fillStyle='#fff';g.fillRect(x+(cx-x)*f-2,y+(cy-y)*f-2,4,4)}});
 ps.forEach(([x,y,on],i)=>{g.save();g.setLineDash([]);g.lineWidth=on?4:1.5;g.strokeStyle=rgba(P[i%3],on?1:.25);g.shadowColor=P[i%3];g.shadowBlur=on?24:0;shp(x,y-20,40,i);g.restore()});
 ring(cx,650,310,62,P[0],3,.55,0);ring(cx,650,220,42,P[1],2,.45,0);glow(cx,650,280,P[0],.2+.2*lit);
 for(let j=0;j<8;j++){const a=T*.15+j*TAU/8,x=cx+cos(a)*420,y=300+sin(a)*130,nx=cx+cos(a+TAU/8)*420,ny=300+sin(a+TAU/8)*130;g.strokeStyle=rgba(P[j%3],.2+.5*lit);g.lineWidth=2;g.setLineDash([]);g.beginPath();g.moveTo(x,y);g.lineTo(nx,ny);g.stroke();g.strokeRect(x-16,y-11,32,22);g.fillStyle=rgba(P[j%3],.8);for(let q=0;q<3;q++)g.fillRect(x-10,y-7+q*5,6+(j*3+q*5)%10,2)}}
